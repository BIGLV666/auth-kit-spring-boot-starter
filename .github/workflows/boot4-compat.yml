name: Boot 4 compatibility

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  boot4:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven
      - name: Install library (Boot 3.5 baseline)
        run: mvn -B -DskipTests -Dgpg.skip=true install
      - name: Build & test Boot 4.2 consumer smoke
        run: |
          VERSION=$(mvn -B -q -DforceStdout help:evaluate -Dexpression=project.version)
          mvn -B -f compat/boot4/pom.xml -Dauth-kit.version="$VERSION" test
